  /* ---- Attachments (embedded in the note, so they stay end-to-end encrypted) ---- */
  const INLINE_IMG = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];  // rendered inline; SVG deliberately excluded
  const FILE_CAP = 1024 * 1024;          // 1 MB hard cap for non-image files
  const IMG_TARGET = 420 * 1024;         // compress images down toward ~420 KB
  const IMG_MAXDIM = 1600;
  function humanSize(b) { b = b || 0; return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
  function isCleanB64(s) { return typeof s === 'string' && /^[A-Za-z0-9+/=\s]*$/.test(s) && s.length > 0; }
  function fileDataUri(f) { return 'data:' + (/^[\w.+-]+\/[\w.+-]+$/.test(f.type || '') ? f.type : 'application/octet-stream') + ';base64,' + f.data; }
  function readAsB64(file, cb) {
    const r = new FileReader();
    r.onload = () => cb({ ok: true, data: String(r.result).split(',')[1] || '', type: file.type || 'application/octet-stream', size: file.size });
    r.onerror = () => cb({ ok: false, reason: 'Could not read that file.' });
    r.readAsDataURL(file);
  }
  function compressImage(file, cb) {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, IMG_MAXDIM / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      let q = 0.85, out = null;
      for (;;) {
        const dataUrl = cv.toDataURL('image/jpeg', q);
        const b64 = dataUrl.split(',')[1] || '';
        out = { ok: true, data: b64, type: 'image/jpeg', size: Math.floor(b64.length * 3 / 4) };
        if (out.size <= IMG_TARGET || q <= 0.4) break;
        q -= 0.12;
      }
      cb(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); cb({ ok: false, reason: 'Could not read this image (an unsupported format like HEIC?). Convert it to JPEG/PNG, or add it as a link.' }); };
    img.src = url;
  }
  function attachFiles(t, fileList) {
    const files = Array.from(fileList || []); if (!files.length) return;
    const msg = $('#m_fileMsg'); let pending = files.length;
    const done = (note) => { pending--; if (note) { if (msg) msg.textContent = note; } if (pending === 0) { persist(); renderModalFiles(t); render(); } };
    files.forEach(file => {
      const isImg = (file.type || '').indexOf('image/') === 0 && file.type !== 'image/svg+xml';
      const store = (res) => {
        if (!res.ok) { done(res.reason || 'Skipped a file.'); return; }
        if (res.size > FILE_CAP && !isImg) { done('“' + file.name + '” is ' + humanSize(res.size) + ' — over the 1 MB limit. Add it as a link instead.'); return; }
        t.files = t.files || [];
        t.files.push({ id: id(), name: String(file.name || 'file').slice(0, 120), type: res.type, size: res.size, data: res.data });
        done(res.size > FILE_CAP ? null : '');
      };
      if (isImg) compressImage(file, store); else readAsB64(file, store);
    });
    if (msg) msg.textContent = 'Processing…';
  }

    };
    $('#paletteOverlay').addEventListener('mousedown', (e) => { if (e.target.id === 'paletteOverlay') closePalette(); });

    // keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undo(); return; }
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); return; }
      if (typing) return;
      const overlayOpen = $('#overlay').classList.contains('open') || $('#statsOverlay').classList.contains('open');
      if (overlayOpen) return;
      if (e.key === 'n') { e.preventDefault(); $('#addTaskBtn').click(); }
      else if (e.key === '/') { e.preventDefault(); $('#search').focus(); }
      else if (e.key === '1') { data.ui.view = 'list'; saveOut(); render(); }
      else if (e.key === '2') { data.ui.view = 'kanban'; saveOut(); render(); }
      else if (e.key === '3') { data.ui.view = 'agenda'; saveOut(); render(); }
      else if (e.key === '4') { data.ui.view = 'matrix'; saveOut(); render(); }
      else if (e.key === '5') { data.ui.view = 'calendar'; saveOut(); render(); }
      else if (e.key === '6') { data.ui.view = 'focus'; saveOut(); render(); }
      else if (e.key === '7') { data.ui.view = 'plan'; saveOut(); render(); }
    });
    const openNewTask = () => {
      // Default new tasks to the "Urgent" list and due today (both overridable in the editor).
      const urgent = data.columns.find(c => /^\s*urgent\s*$/i.test(c.name || ''));
      const t = newTask('', (urgent || data.columns[0]).id);
      t.due = todayStr();
      persist(); render(); openModal(t.id);
    };
    $('#addTaskBtn').onclick = openNewTask;
    $('#addTaskTop').onclick = openNewTask;
    // modal
    $('#m_close').onclick = closeModal;
    $('#m_save').onclick = closeModal;
    $('#m_moreToggle').onclick = () => setMore($('#m_more').hidden);
    $('#overlay').addEventListener('mousedown', (e) => { if (e.target.id === 'overlay') closeModal(); });
    const toggleModalDone = () => {
      const t = data.tasks[editingId]; if (!t) return;
      onComplete(t, () => {
        toggleDone(t);
        $('#m_done').className = 'checkbox' + (t.done ? ' done' : '');
        $('#m_done').setAttribute('aria-checked', t.done ? 'true' : 'false');
        // keep the List/Column dropdown in sync with any auto-move to Done,
        // otherwise closing the modal would move the task back.
        $('#m_column').value = columnOf(editingId) || $('#m_column').value;
        persist();
      });
    };
    $('#m_done').onclick = toggleModalDone;
    $('#m_done').onkeydown = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleModalDone(); } };
    $('#m_title').onkeydown = (e) => { if (e.key === 'Enter') closeModal(); };
    ['m_due','m_dueTime','m_priority','m_notes','m_column'].forEach(idn => { const e=document.getElementById(idn); e.onchange = commitModal; });
    $('#m_subInput').onkeydown = (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        const t = data.tasks[editingId];
        const ch = newTask(e.target.value.trim(), columnOf(t.id) || data.columns[0].id);
        ch.parentId = t.id;
        e.target.value=''; persist(); renderModalSubtasks(t); render();
      }
    };
    $('#m_addLink').onclick = () => {
      const t = data.tasks[editingId];
      const url = $('#m_linkUrl').value.trim(); if (!url) return;
      let u = url; if (!/^https?:\/\//i.test(u) && !/^mailto:/i.test(u)) u = 'https://' + u;
      t.links.push({ label: $('#m_linkLabel').value.trim(), url: u });
      $('#m_linkLabel').value=''; $('#m_linkUrl').value=''; persist(); renderModalLinks(t);
    };
    $('#m_addFile').onclick = () => { const fi = $('#m_fileInput'); if (fi) fi.click(); };
    $('#m_fileInput').onchange = (e) => {
      const t = data.tasks[editingId]; if (!t) return;
      attachFiles(t, e.target.files); e.target.value = '';
    };
    $('#m_delete').onclick = () => {
      if (!editingId) return;
      const tid = editingId;
      uiConfirm('Delete this task?', () => {
        deleteTask(tid); editingId=null; $('#overlay').classList.remove('open'); persist(); render();
      });
    };
    $('#m_complete').onclick = () => {
      const t = data.tasks[editingId]; if (!t) return;
      if (t.done) { closeModal(); return; }   // already complete
      onComplete(t, () => { toggleDone(t); editingId = null; $('#overlay').classList.remove('open'); persist(); render(); });
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#overlay').classList.contains('open')) closeModal(); });
    // flush on unload
    window.addEventListener('beforeunload', () => { if (dirty) SNBridge.flushNow(); });
  }

  /* ---- inline column rename (works inside SN's sandboxed iframe, unlike prompt) ---- */
  function startRename(col, titleEl) {
    if (!titleEl || !titleEl.parentNode) return;
    const input = el('input'); input.type = 'text'; input.value = col.name;
    input.style.flex = '1 1 auto'; input.style.minWidth = '0';
    titleEl.replaceWith(input);
    input.focus(); input.select();
    let done = false;
    const commit = () => {
      if (done) return; done = true;
      const v = input.value.trim();
      if (v) col.name = v;
      persist(); render();
    };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { done = true; render(); }
    };
    input.onblur = commit;
  }

  /* ---- in-app confirm dialog (replaces blocked window.confirm) ---- */
  function uiConfirm(message, onYes) {
    const ov = el('div', 'overlay'); ov.style.display = 'flex'; ov.style.zIndex = '100';
    const box = el('div', 'modal'); box.style.maxWidth = '380px';
    box.appendChild(el('div', 'modal-body', '<div>' + escapeHtml(message) + '</div>'));
    const foot = el('div', 'modal-foot'); foot.style.justifyContent = 'flex-end'; foot.style.gap = '8px';
    const cancel = el('button', 'ghost', 'Cancel');
    const yes = el('button', 'primary', 'OK'); yes.style.background = 'var(--danger)'; yes.style.borderColor = 'var(--danger)';
    foot.appendChild(cancel); foot.appendChild(yes); box.appendChild(foot);
    ov.appendChild(box); document.body.appendChild(ov);
    const close = () => ov.remove();
    cancel.onclick = close;
    ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
    yes.onclick = () => { close(); onYes(); };
  }

  /* ---- utils ---- */
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function escapeAttr(s){ return escapeHtml(s); }
  // Only allow http/https/mailto to ever become a clickable href. Blocks
  // javascript:, data:, file:, etc. — even if a link was hand-edited into the note JSON.
  function safeUrl(u){
    const s = String(u == null ? '' : u).trim();
    return /^(https?:|mailto:)/i.test(s) ? s : null;
  }

  return {
    start() {
      wire();
      SNBridge.init({
        debounceSave: 250,
        onNote: (text) => { standalone = false; load(text); },
        onStandalone: () => { standalone = true; load(''); }
      });
    },
    _test: { todayMITs, mitDayWon, setMIT, doneOn, shipStreak, domainStats, daysSince, calibration, throughputWeeks, quickWins, stickyTasks, matchesFilters, addWin, winsFor, todayStr, addDays, filters, _set: (d) => { data = d; } }
  };
})();

document.addEventListener('DOMContentLoaded', App.start);
</script>
</body>
</html>
