<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Security hardening: deny by default; allow only the app's own inline code/styles and
     theme assets. connect-src 'none' blocks all network egress (the app makes none); the SN
     bridge uses postMessage, which CSP does not restrict. No external scripts, eval, plugins,
     <base> hijacking, or form submissions are permitted. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https: http: data:; img-src https: http: data: blob:; font-src https: http: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tasks</title>
<style>
  /* Inside Standard Notes, the --sn-stylekit-* variables are supplied by your
     active theme, so the plugin automatically matches the app. The fallbacks
     below are a clean LIGHT theme used only when those variables aren't present
     (e.g. the default Standard Notes theme, the test harness, or opening the
     file directly), so you get a white background rather than a dark one. */
  :root {
    --bg:        var(--sn-stylekit-background-color, #ffffff);
    --fg:        var(--sn-stylekit-foreground-color, #1f2328);
    --panel:     var(--sn-stylekit-contrast-background-color, #f4f6f8);
    --panel-2:   var(--sn-stylekit-secondary-background-color, #ffffff);
    --border:    var(--sn-stylekit-border-color, #d8dce0);
    --muted:     var(--sn-stylekit-passive-color-1, #6b7177);
    --muted-2:   var(--sn-stylekit-passive-color-2, #9aa0a6);
    --accent:    var(--sn-stylekit-info-color, #2f6fed);
    --accent-fg: var(--sn-stylekit-info-contrast-color, #ffffff);
    --danger:    var(--sn-stylekit-danger-color, #e5484d);
    --success:   var(--sn-stylekit-success-color, #30a46c);
    --warning:   var(--sn-stylekit-warning-color, #c47900);
    --radius: 8px;
    --shadow: 0 6px 24px rgba(0,0,0,0.18);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }

  button, input, select, textarea {
    font-family: inherit; font-size: inherit; color: var(--fg);
  }
  button {
    background: transparent; border: 1px solid transparent; color: var(--fg);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; line-height: 1.2;
  }
  button:hover { background: var(--panel-2); }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { border-color: var(--border); }
  button.danger { color: var(--danger); }
  button.danger:hover { background: rgba(229,72,77,0.12); }
  input[type=text], input[type=search], input[type=date], input[type=url], textarea, select {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; outline: none; width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  /* Notes: roomy and auto-growing (the drag handle is unusable by touch) */
  #m_notes { min-height: 110px; max-height: 60vh; line-height: 1.5; }
  ::placeholder { color: var(--muted-2); }

  /* Toolbar -------------------------------------------------------------- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .toolbar .grow { flex: 1 1 auto; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .pal-item { display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; border-top:1px solid var(--border); }
  .pal-item:first-child { border-top:none; }
  .pal-item.sel { background:var(--panel); }
  .pal-item .pi-ic { width:18px; text-align:center; flex:0 0 auto; color:var(--muted); }
  .pal-item .pi-main { flex:1; }
  .pal-item .pi-sub { font-size:12px; color:var(--muted); }
  .mitbanner { background:linear-gradient(0deg,var(--panel),var(--panel)); border-left:4px solid #f5a623; }
  .mitbanner.won { border-left-color:var(--success); }
  .pomo { display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; }
  .pomo .pomo-time { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .plan-row { display:flex; gap:10px; align-items:stretch; margin-bottom:8px; }
  .plan-time { width:84px; flex:0 0 auto; text-align:right; font-size:13px; color:var(--muted); padding-top:4px; }
  .plan-block { flex:1; background:var(--panel-2); border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:6px; padding:8px 10px; cursor:pointer; }
  .plan-block:hover { border-color:var(--muted-2); }
  .plan-block.over { opacity:.6; }
  .seg button { border-radius: 0; border: none; padding: 5px 12px; }
  .seg button.active { background: var(--accent); color: var(--accent-fg); }
  .search { max-width: 240px; }
  .filterbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .filterbar select { width: auto; min-width: 120px; }
  .tagfilter { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px;
    border-radius: 999px; font-size: 12px; border: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  .chip.active { border-color: transparent; }
  .chip.done .chip-lbl { text-decoration: line-through; opacity: .55; }
  .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .icononly { padding: 5px 9px; font-size: 16px; line-height: 1; }
  .addtask-top { font-weight: 700; padding: 7px 16px; font-size: 14px; border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,.15); white-space: nowrap; }
  .addtask-top:hover { filter: brightness(1.08); }
  .ghost.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .filterBtn-dot { position: relative; }
  .filterBtn-dot::after { content:""; position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%; background: var(--accent); }

  /* dropdown menus (view-more, overflow) */
  .menu { position: fixed; z-index: 200; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: var(--shadow); min-width: 190px; padding: 6px; }
  .menu-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: 6px; border: none; background: transparent; }
  .menu-item:hover { background: var(--panel); }
  .menu-item.active { color: var(--accent); font-weight: 600; }
  .menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }

  /* quick-add bar */
  .quickbar { padding: 8px 12px 0; }
  .quickbar input { width: 100%; max-width: 820px; margin: 0 auto; display: block; }

  /* floating action button */
  .fab { position: absolute; right: 18px; bottom: 18px; z-index: 40;
    width: 52px; height: 52px; border-radius: 50%; font-size: 26px; line-height: 1;
    background: var(--accent); color: var(--accent-fg); border: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.28); display: flex; align-items: center; justify-content: center; }
  .fab:hover { filter: brightness(1.08); background: var(--accent); }

  /* Board area ----------------------------------------------------------- */
  .surface { flex: 1 1 auto; overflow: auto; padding: 12px; }

  /* friendly empty state */
  .emptybox { max-width: 460px; margin: 40px auto; text-align: center; color: var(--muted); padding: 24px; }
  .emptybox .em-emoji { font-size: 34px; margin-bottom: 8px; }
  .emptybox .em-title { font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .emptybox .em-cta { margin-top: 14px; }

  /* Kanban */
  /* Board: fixed-height column row so each column anchors in place and scrolls its
     own tasks internally, instead of the whole surface drifting around. */
  .kanban { display: flex; gap: 12px; align-items: flex-start; height: 100%; }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    width: 290px; min-width: 290px; display: flex; flex-direction: column; max-height: 100%;
  }
  .column.dragover { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .column-head {
    display: flex; align-items: center; gap: 4px; padding: 8px 10px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2; background: var(--panel); border-radius: var(--radius) var(--radius) 0 0;
  }
  .column-head .title { font-weight: 600; flex: 1 1 auto; cursor: text; }
  .column-head .num { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .column-body { padding: 8px; overflow-y: auto; flex: 1 1 auto; min-height: 24px; }
  .addcol { min-width: 200px; }

  /* List view */
  .list { max-width: 820px; margin: 0 auto; }
  .list-group-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 14px 4px 6px; font-weight: 600;
  }

  /* Task card */
  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 10px; margin-bottom: 8px; cursor: pointer; position: relative;
  }
  .card:hover { border-color: var(--muted-2); }
  .card.dragging { opacity: .5; }
  .card.completed .card-title { text-decoration: line-through; color: var(--muted); }
  /* nested subtasks: indent guide + collapse caret + parent breadcrumb */
  .card.child { border-left: 3px solid var(--muted-2); }
  .caret-btn { flex: 0 0 auto; width: 18px; height: 18px; padding: 0; margin-top: 1px; border: none; background: transparent;
    color: var(--muted); font-size: 11px; line-height: 1; cursor: pointer; border-radius: 4px; }
  .caret-btn:hover { background: var(--panel); color: var(--fg); }
  .breadcrumb { font-size: 11px; color: var(--muted); cursor: pointer; margin-bottom: 4px; padding-left: 2px; }
  .breadcrumb:hover { color: var(--accent); text-decoration: underline; }
  .card-row { display: flex; align-items: flex-start; gap: 8px; }
  .checkbox {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--muted-2);
    margin-top: 1px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .checkbox.done { background: var(--success); border-color: var(--success); }
  .checkbox.done::after { content: "✓"; color: #fff; font-size: 12px; line-height: 1; }
  .card-title { flex: 1 1 auto; word-break: break-word; }
  .prio-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: var(--radius) 0 0 var(--radius); }
  .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; padding-left: 26px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px;
    padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
  }
  .badge.due-today { color: var(--warning); border-color: var(--warning); }
  .badge.due-over  { color: var(--danger); border-color: var(--danger); }
  .badge.tag { color: var(--fg); }
  .badge.sub { }
  .badge svg { width: 12px; height: 12px; }
  /* calmer cards: secondary details collapse into one muted, borderless cluster */
  .badge.mini { border: none; background: transparent; color: var(--muted-2); padding: 1px 2px; gap: 7px; }
  .badge.mini svg { width: 12px; height: 12px; }
  .mini-sep { display: inline-block; width: 1px; height: 10px; background: var(--border); vertical-align: middle; }
  /* inline edit fields (rename / reschedule without opening the editor) */
  .card .inline-rename { width: 100%; font: inherit; padding: 2px 5px; border: 1px solid var(--accent); border-radius: 5px; background: var(--bg); }
  .card .inline-due { font: inherit; padding: 2px 4px; border: 1px solid var(--accent); border-radius: 5px; background: var(--bg); }
  /* swipe feedback (List/Agenda, touch) */
  .card.swipe-right { background: color-mix(in srgb, var(--success) 15%, var(--panel-2)); }
  .card.swipe-left  { background: color-mix(in srgb, var(--warning) 15%, var(--panel-2)); }
  /* calmer cards: reveal star/pin on hover (desktop); keep them tappable on touch */
  .card-act { flex: 0 0 auto; padding: 0 4px; background: transparent; border: none; opacity: .5; }
  @media (hover: hover) {
    .card .card-act { opacity: 0; }
    .card:hover .card-act, .card:focus-within .card-act { opacity: .7; }
  }
  .card-act:hover { opacity: 1 !important; background: transparent; }
  /* compact density */
  .compact .card { padding: 5px 9px; margin-bottom: 5px; }
  .compact .meta-row { margin-top: 3px; gap: 4px; }
  .compact .badge.secondary { display: none; }
  .compact .list-group-title { margin: 10px 4px 4px; }

  /* Modal ---------------------------------------------------------------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
    align-items: flex-start; justify-content: center; z-index: 50; overflow: auto; padding: 40px 16px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 560px; box-shadow: var(--shadow);
    max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  }
  .modal-head { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); gap: 8px; flex: 0 0 auto; }
  .modal-head .grow { flex: 1; min-width: 0; }
  .modal-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex: 1 1 auto; }
  .modal-foot { display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid var(--border); align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
  .field { min-width: 0; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  /* inputs must be able to shrink inside flex rows, or they overflow on mobile */
  .field input, .field select, .field textarea { width: 100%; min-width: 0; box-sizing: border-box; }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field-row > .field { flex: 1 1 150px; min-width: 0; }
  .field-row > .field-sm { flex: 0 1 84px; }
  .due-pair { display: flex; gap: 6px; }
  .due-pair input[type=date] { flex: 1 1 auto; }
  .due-pair input[type=time] { flex: 0 1 120px; }
  /* "More options" progressive disclosure */
  .more-toggle { display: flex; align-items: center; gap: 6px; width: 100%; justify-content: flex-start;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
    font-weight: 600; color: var(--fg); cursor: pointer; }
  .more-toggle:hover { background: var(--panel-2, var(--panel)); }
  .more-toggle .caret { transition: transform .15s ease; display: inline-block; }
  .more-toggle[aria-expanded="true"] .caret { transform: rotate(90deg); }
  .more-fields { display: flex; flex-direction: column; gap: 14px; }
  .opt-check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .opt-check input { width: auto; margin: 0; flex: 0 0 auto; }

  .subtasks .sub-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .subtasks .sub-item input[type=text] { flex: 1; }
  .links .link-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .links .link-item input { flex: 1; }
  .inline-add { display: flex; gap: 8px; margin-top: 6px; align-items: center; }
  /* attachments */
  .file-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); }
  .file-item:first-child { border-top: none; }
  .file-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; flex: 0 0 auto; background: var(--panel); }
  .file-ic { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 22px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); flex: 0 0 auto; }
  .file-meta { flex: 1 1 auto; min-width: 0; }
  .file-name { word-break: break-all; }
  .file-sz { font-size: 12px; color: var(--muted); }

  .tag-editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag-editor .chip .x { cursor: pointer; opacity: .7; }
  .tag-editor input { width: 120px; border: none; background: transparent; padding: 2px; }

  .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
  .quickadd { display: flex; gap: 6px; margin-bottom: 8px; }
  .quickadd input { flex: 1; }
  .iconbtn { padding: 4px 6px; line-height: 1; color: var(--muted); }
  .iconbtn:hover { color: var(--fg); }
  .hidden { display: none !important; }
  .small { font-size: 12px; color: var(--muted); }
  .pill-prio { font-size: 11px; padding: 1px 6px; border-radius: 4px; }

  /* select mode + bulk bar */
  button.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .card.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bulkbar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border);
  }
  .bulkbar select { width: auto; }

  /* markdown preview */
  .md-preview { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-top: 6px; background: var(--panel); }
  .md-preview h1, .md-preview h2, .md-preview h3 { margin: .35em 0; line-height: 1.25; }
  .md-preview h1 { font-size: 1.3em; } .md-preview h2 { font-size: 1.15em; } .md-preview h3 { font-size: 1.05em; }
  .md-preview ul, .md-preview ol { margin: .35em 0 .35em 1.3em; padding: 0; }
  .md-preview p { margin: .4em 0; }
  .md-preview code { background: var(--bg); padding: 1px 4px; border-radius: 4px; font-size: .92em; }
  .md-preview a { color: var(--accent); }
  .md-preview .md-check { color: var(--muted); margin-right: 4px; }

  /* stats */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .stat-num { font-size: 22px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar-track { flex: 1; height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); }

  /* eisenhower matrix */
  .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .matrix-cell { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; min-height: 90px; }

  /* calendar view */
  .cv-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .cv-head .t { font-weight:600; min-width:150px; }
  .cv { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cv-dow { text-align:center; font-size:11px; color:var(--muted); }
  .cv-cell { border:1px solid var(--border); border-radius:6px; min-height:86px; padding:4px; display:flex; flex-direction:column; gap:3px; }
  .cv-cell.empty { border:none; }
  .cv-cell.caltoday { outline:2px solid var(--accent); outline-offset:-2px; }
  .cv-top { display:flex; align-items:center; justify-content:space-between; }
  .cv-num { font-size:11px; color:var(--muted); }
  .cv-add { font-size:13px; color:var(--muted-2); cursor:pointer; line-height:1; padding:0 3px; }
  .cv-add:hover { color:var(--accent); }
  .cv-chip { font-size:11px; padding:1px 5px; border-radius:4px; background:var(--panel); border-left:3px solid var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .cv-chip.done { text-decoration:line-through; color:var(--muted); }
  .cv-more { font-size:10px; color:var(--muted-2); }
  @media (max-width:620px){ .cv-cell { min-height:58px; } .cv-chip { font-size:10px; } }
  @media (max-width: 620px) { .matrix { grid-template-columns: 1fr; } }

  /* smart view chips */
  .smartviews { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px 12px 0; }
  .smartviews .chip.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* due-today banner */
  .banner {
    display: flex; align-items: center; gap: 10px; margin: 8px 12px 0;
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--warning);
    background: color-mix(in srgb, var(--warning) 12%, transparent);
  }
  .banner .grow { flex: 1; }

  /* mobile polish */
  @media (max-width: 620px) {
    .toolbar { gap: 6px; padding: 8px 10px; }
    .search { max-width: none; flex: 1 1 120px; order: 5; }
    /* view tabs get their own swipeable row instead of wrapping into a messy grid */
    #viewSeg { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    #viewSeg::-webkit-scrollbar { display: none; }
    .seg button { padding: 8px 13px; white-space: nowrap; }
    /* Reclaim vertical space for tasks: the floating + covers adding, and the
       search + smart-view chips fold away behind the Filter button until needed. */
    .addtask-top { display: none; }
    .search { display: none; }
    .smartviews { display: none; }
    #app.filters-open .search { display: block; }
    #app.filters-open .smartviews { display: flex; }
    .banner { margin: 6px 10px 0; padding: 6px 10px; font-size: 13px; }
    /* Board: the column row itself is the horizontal scroller and snaps each column
       into place, so swiping between lists anchors cleanly instead of drifting. */
    .surface { overflow-x: hidden; }
    .kanban { height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .kanban::-webkit-scrollbar { display: none; }
    /* one list fills the screen so you focus on it; swipe to the next */
    .kanban .column { width: calc(100vw - 24px); min-width: calc(100vw - 24px); scroll-snap-align: center; }
    .filterbar { gap: 6px; }
    /* comfortable, tall notes on phones */
    #m_notes { min-height: 160px; }
    /* stop iOS Safari zooming the page when a field gains focus (needs >=16px) */
    input[type=text], input[type=search], input[type=date], input[type=time], input[type=url], input[type=number], textarea, select { font-size: 16px; }
    /* leave room so the last card clears the floating + button */
    .surface { padding-bottom: 92px; }
    .fab { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); }
    /* Full-screen editor on phones: the task opens at the TOP (title, due, priority
       first) as a real page, instead of a cramped bottom sheet stuck behind the keyboard. */
    .overlay { padding: 0; align-items: stretch; }
    .overlay .modal { max-width: 100%; width: 100%; border-radius: 0; height: 100vh; height: 100dvh; max-height: none; }
    .modal-head { position: sticky; top: 0; z-index: 3; background: var(--bg); }
    .modal-foot { position: sticky; bottom: 0; z-index: 3; background: var(--bg); padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .modal-body { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
  /* bigger, comfortable touch targets on finger-driven devices */
  @media (pointer: coarse) {
    .checkbox { width: 24px; height: 24px; }
    .checkbox.done::after { font-size: 15px; }
    .meta-row { padding-left: 32px; }
    .caret-btn { width: 30px; height: 30px; font-size: 13px; }
    .card-row { gap: 10px; }
    .card { padding: 11px 12px; }
    .seg button { padding: 9px 14px; }
    .iconbtn { padding: 8px; }
    .card-act { display: none; }  /* hide inactive star/pin on touch; they stay in the editor */
    .chip { padding: 5px 11px; }
    .fab { width: 58px; height: 58px; font-size: 28px; }
  }

  /* ---- Accessibility & polish ---- */
  /* clear keyboard focus ring for everyone navigating without a mouse */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .card:focus-visible, .checkbox:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card { transition: border-color .12s ease, box-shadow .12s ease; }
  .card:active { transform: none; }
  .banner.health { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  /* gentle entrance for dialogs (disabled under reduced-motion below) */
  .overlay.open .modal { animation: modalIn .18s ease; }
  @keyframes modalIn { from { opacity: .4; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  /* respect users who prefer less motion — kills swipe/level/reward/animation transitions */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<script>
"use strict";
/* ===========================================================================
   PART 1 — Standard Notes component bridge (vanilla port of the documented
   component-relay protocol). No build step, no dependencies.
   Protocol reference: standardnotes component messaging
   (stream-context-item / save-items / component-registered / themes).
   =========================================================================== */
const SNBridge = (function () {
  const Action = {
    StreamContextItem: 'stream-context-item',
    SaveItems: 'save-items',
    ComponentRegistered: 'component-registered',
    ActivateThemes: 'themes',
    ThemesActivated: 'themes-activated',
    SetComponentData: 'set-component-data',
  };
  const API_COMPONENT = 'component';

  let sessionKey = null;
  let environment = null;
  let platform = null;
  let componentData = {};
  let lastItem = null;            // current NoteContainer
  const sentMessages = [];        // awaiting replies (messageId -> callback)
  const queue = [];               // messages sent before registration
  let activeThemes = [];
  let onNote = null;              // callback(noteText, meta)
  let saveTimer = null;
  let saveDelay = 250;
  let standalone = false;         // true when not embedded in SN (test harness / direct open)

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function isMobile() { return environment === 'mobile'; }

  function post(action, data, callback) {
    if (!sessionKey) { queue.push({ action, data, callback }); return; }
    const message = { action, data, messageId: uuid(), sessionKey, api: API_COMPONENT };
    const stored = JSON.parse(JSON.stringify(message));
    stored.callback = callback;
    sentMessages.push(stored);
    window.parent.postMessage(isMobile() ? JSON.stringify(message) : message, '*');
  }

  function handle(payload) {
    if (!payload || !payload.action) return;
    if (payload.action === Action.ComponentRegistered) {
      sessionKey = payload.sessionKey;
      if (payload.componentData) componentData = payload.componentData;
      const d = payload.data || {};
      environment = d.environment; platform = d.platform;
      // flush queue
      const pending = queue.splice(0, queue.length);
      pending.forEach(m => post(m.action, m.data, m.callback));
      activateThemes(d.activeThemeUrls || []);
      post(Action.ThemesActivated, {});
      // begin streaming the open note
      post(Action.StreamContextItem, {}, onStreamed);
      return;
    }
    if (payload.action === Action.ActivateThemes) {
      activateThemes((payload.data && payload.data.themes) || []);
      return;
    }
    // reply routing
    if (!payload.original) return;
    const idx = sentMessages.findIndex(m => m.messageId === payload.original.messageId);
    if (idx === -1) return;
    const original = sentMessages[idx];
    if (original.callback) original.callback(payload.data);
  }

  function onStreamed(data) {
    const item = data && data.item;
    if (!item) return;
    lastItem = item;
    if (item.isMetadataUpdate) return;   // skip pure metadata pings
    if (onNote) onNote(text(), meta());
  }

  function text() {
    return (lastItem && lastItem.content && lastItem.content.text) || '';
  }
  function meta() {
    if (lastItem && lastItem.content) {
      const id = lastItem.content.editorIdentifier;
      const app = lastItem.content.appData || {};
      return (id && app[id]) || {};
    }
    return {};
  }

  function save(newText, previewText) {
    if (standalone) { return; } // nothing to save to when opened directly
    if (!lastItem) return;
    lastItem.content.text = newText;
    if (typeof previewText === 'string') lastItem.content.preview_plain = previewText;
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, saveDelay);
  }
  function flush() {
    if (!lastItem) return;
    const copy = Object.assign({}, lastItem);
    copy.children = null; copy.parent = null;
    post(Action.SaveItems, { items: [copy] });
  }

  function activateThemes(urls) {
    if (activeThemes.sort().toString() === urls.slice().sort().toString()) return;
    // remove old
    Array.from(document.getElementsByClassName('sn-theme')).forEach(el => el.remove());
    urls.forEach(url => {
      if (!url) return;
      const link = document.createElement('link');
      link.className = 'sn-theme'; link.rel = 'stylesheet'; link.type = 'text/css'; link.href = url;
      document.head.appendChild(link);
    });
    activeThemes = urls;
  }

  function listen() {
    const onMsg = (event) => {
      // Only accept messages from the embedding Standard Notes frame. This rejects
      // messages injected by other windows/iframes. (On mobile the source can be null,
      // which we allow; in that path the message structure is still validated in handle().)
      if (event.source && event.source !== window.parent) return;
      let data = event.data;
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { return; } }
      handle(data);
    };
    window.addEventListener('message', onMsg, false);
    document.addEventListener('message', onMsg, false); // RN/mobile
  }

  return {
    init(opts) {
      opts = opts || {};
      saveDelay = typeof opts.debounceSave === 'number' ? opts.debounceSave : 250;
      onNote = opts.onNote || null;
      listen();
      // If we are not inside an SN iframe, no registration will arrive.
      // Detect after a short grace period and run standalone with localStorage.
      setTimeout(() => {
        if (!sessionKey) {
          standalone = true;
          if (opts.onStandalone) opts.onStandalone();
        }
      }, 600);
    },
    save,
    flushNow: flush,
    isStandalone() { return standalone; },
    env() { return environment; },
  };
})();

/* ===========================================================================
   PART 2 — Task manager application.
   Data lives as a JSON string inside the note's text (one board per note).
   =========================================================================== */
const App = (function () {
  const SCHEMA = 2;
  const TAG_COLORS = ['#2f6fed','#30a46c','#f5a623','#e5484d','#8e4ec6','#0aa5b8','#d6409f','#a18072'];
  const PRIO = { 0:{label:'None',color:'transparent'}, 1:{label:'Low',color:'#0aa5b8'},
                 2:{label:'Medium',color:'#f5a623'}, 3:{label:'High',color:'#e5484d'} };
  const DOMAINS = [ {k:'Book',c:'#8e4ec6',i:'📖'}, {k:'Training',c:'#e5484d',i:'🚴'}, {k:'Family',c:'#30a46c',i:'👨‍👩‍👦'}, {k:'Giving',c:'#f5a623',i:'🎁'}, {k:'Work',c:'#2f6fed',i:'💼'} ];
  const ENERGY = [ {k:'low',l:'Low'}, {k:'med',l:'Medium'}, {k:'high',l:'High'} ];
  const IMPACT = { 0:'—', 1:'Low', 2:'Medium', 3:'High' };
  const MIT_MAX = 3;
  function domainOf(k){ return DOMAINS.find(d=>d.k===k)||null; }

  let data = null;        // { schema, columns:[{id,name}], tasks:{id:task}, order:{colId:[taskId]}, tags:{name:color}, ui:{view} }
  let dirty = false;
  let editingId = null;   // task currently open in modal
  let standalone = false;
  let selectMode = false;            // bulk multi-select mode
  const selectedIds = new Set();     // ids selected in bulk mode (not persisted)
  const undoStack = [];              // serialized prior states (not persisted)
  let lastSerialized = null;         // last saved serialization, used for undo capture
  let summaryDismissed = false;      // "due today" banner dismissed this session
  let healthDismissed = false;       // note-size warning dismissed this session
  let activeSmart = null;            // currently active smart-view chip
  let calMonthOffset = 0;            // calendar view month offset (0 = current)
  let pomoRemaining = 0, pomoTimer = null;          // pomodoro timer state
  let reviewQueue = [], reviewIdx = 0, reviewStats = null;  // weekly review state

  const filters = { search:'', status:'all', due:'all', sort:'manual', tags:new Set(), priorityMin:0, domain:null, rightNow:null };

  /* ---- persistence ---- */
  function defaultData() {
    const c1 = id(), c2 = id(), c3 = id();
    return {
      schema: SCHEMA,
      columns: [ {id:c1,name:'To Do'}, {id:c2,name:'In Progress'}, {id:c3,name:'Done'} ],
      tasks: {},
      order: { [c1]:[], [c2]:[], [c3]:[] },
      tags: {},
      ui: { view: 'list' }
    };
  }
  function id() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID().slice(0,8) : Math.random().toString(36).slice(2,10); }

  function load(text) {
    let parsed = null;
    if (text && text.trim()) { try { parsed = JSON.parse(text); } catch (e) { parsed = null; } }
    if (!parsed || !parsed.columns) { data = defaultData(); }
    else { data = migrate(parsed); }
    // restore standalone state
    if (standalone) {
      try {
        const saved = localStorage.getItem('sn-tasks-standalone');
        if (saved) data = migrate(JSON.parse(saved));
      } catch (e) {}
    }
    sanitize();
    filters.sort = data.ui.sort || 'due';   // persisted sort; default to due date
    lastSerialized = JSON.stringify(data);
    undoStack.length = 0;
    summaryDismissed = false; healthDismissed = false;
    render();
  }
  function migrate(d) {
    d.schema = d.schema || 1;
    d.tasks = d.tasks || {};
    d.order = d.order || {};
    d.tags = d.tags || {};
    d.ui = d.ui || { view:'list' };
    d.templates = d.templates || [];
    if (!d.columns || !d.columns.length) d.columns = defaultData().columns;
    // ensure newer flags exist on tasks/ui created by older versions
    Object.values(d.tasks).forEach(t => {
      if (typeof t.archived === 'undefined') t.archived = false;
      if (typeof t.hideFromList === 'undefined') t.hideFromList = false;
      if (typeof t.recur === 'undefined') t.recur = 'none';
      if (typeof t.recurEvery === 'undefined') t.recurEvery = 1;
      if (typeof t.recurBasis === 'undefined') t.recurBasis = 'due';
      if (typeof t.start === 'undefined') t.start = null;
      if (typeof t.dueTime === 'undefined') t.dueTime = null;
      if (typeof t.pinned === 'undefined') t.pinned = false;
      if (!Array.isArray(t.blockedBy)) t.blockedBy = [];
      if (!Array.isArray(t.related)) t.related = [];
      if (typeof t.estimate === 'undefined') t.estimate = null;
      if (typeof t.domain === 'undefined') t.domain = null;
      if (typeof t.impact === 'undefined') t.impact = 0;
      if (typeof t.energy === 'undefined') t.energy = null;
      if (typeof t.mit === 'undefined') t.mit = null;
      if (typeof t.bumpCount === 'undefined') t.bumpCount = 0;

          tags:[], links:[], subtasks:[], done: !!s.done, archived:false, hideFromList:false,
          recur:'none', recurEvery:1, recurBasis:'due', start:null, blockedBy:[], pinned:false,

  function sanitize() {

        if (data.tasks[tid] && !seen.has(tid)) { seen.add(tid); return true; }

    });

    Object.keys(data.tasks).forEach(tid => {

    });

    Object.values(data.tasks).forEach(t => {

  /* ---- Note health: keep an eye on total size (attachments live in the note) ---- */
  const NOTE_WARN_BYTES = 2 * 1024 * 1024;   // heuristic: large notes can slow SN sync

  function humanBytes(b) { b = b || 0; return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
  function renderHealthBanner() {

  /* ---- task helpers ---- */
  function newTask(title, columnId) {
    const t = {
      id: id(), title: (title||'').trim(), notes:'', due:null, dueTime:null, priority:0,
      tags:[], links:[], subtasks:[], done:false, archived:false, hideFromList:false,
      recur:'none', recurEvery:1, recurBasis:'due', start:null, blockedBy:[], pinned:false,
      estimate:null, related:[], parentId:null, collapsed:false, files:[],
      domain:null, impact:0, energy:null, mit:null, bumpCount:0, actualMin:null,
      createdAt: new Date().toISOString(), completedAt:null

    columnId = columnId || data.columns[0].id;
    (data.order[columnId] = data.order[columnId] || []).push(t.id);
    return t;
  }
  function columnOf(taskId) {
    for (const c of data.columns) if ((data.order[c.id]||[]).includes(taskId)) return c.id;
    return null;
  }
  /* ---- task hierarchy (nested subtasks via parentId) ---- */
  function orderIndexMap() { const m = {}; let i = 0; data.columns.forEach(c => (data.order[c.id] || []).forEach(tid => { m[tid] = i++; })); return m; }
  function childrenOf(pid) { const idx = orderIndexMap(); return Object.values(data.tasks).filter(t => t.parentId === pid).sort((a, b) => (idx[a.id] ?? 1e9) - (idx[b.id] ?? 1e9)); }
  function hasChildren(pid) { return Object.values(data.tasks).some(t => t.parentId === pid); }
  function descendantStats(pid) {
    let done = 0, total = 0;
    (function rec(p) { Object.values(data.tasks).forEach(t => { if (t.parentId === p && !t.archived) { total++; if (t.done) done++; rec(t.id); } }); })(pid);
    return { done, total };
  }
  function deleteSubtree(taskId) { childrenOf(taskId).slice().forEach(c => deleteSubtree(c.id)); deleteTask(taskId); }
  function moveTask(taskId, toCol, toIndex) {
    const from = columnOf(taskId);
    if (from) data.order[from] = data.order[from].filter(t => t !== taskId);
    const arr = data.order[toCol] = data.order[toCol] || [];
    if (typeof toIndex !== 'number' || toIndex < 0 || toIndex > arr.length) toIndex = arr.length;
    arr.splice(toIndex, 0, taskId);
  }
  function deleteTask(taskId) {

    const c = columnOf(taskId);

  function moveColumn(colId, dir) {
    const i = data.columns.findIndex(c => c.id === colId);

  function findDoneColumn() {

  function isImportantColumn(colId) {

  }
  // Create the next occurrence of a recurring task; returns its id (or null).
  function spawnNextOccurrence(t, placeColId) {
    if (!t.recur || t.recur === 'none') return null;
    const next = JSON.parse(JSON.stringify(t));
    next.id = id(); next.done = false; next.completedAt = null; next.archived = false;
    next.createdAt = new Date().toISOString();
    const basisDate = (t.recurBasis === 'completed') ? todayStr() : t.due;
    next.due = computeNextDue(basisDate, t.recur, t.recurEvery);
    next.subtasks = []; next.start = null; next.blockedBy = []; next.files = [];
    delete next._fromColumn;
    data.tasks[next.id] = next;
    const placeCol = placeColId || data.columns[0].id;
    (data.order[placeCol] = data.order[placeCol] || []).unshift(next.id);
    // carry nested subtasks into the new occurrence, reset to not-done
    (function cloneKids(oldPid, newPid) {
      childrenOf(oldPid).forEach(ch => {
        const c = JSON.parse(JSON.stringify(ch));
        c.id = id(); c.done = false; c.completedAt = null; c.archived = false; c.createdAt = new Date().toISOString();
        c.parentId = newPid; c.blockedBy = []; c.related = []; c.mit = null; c.subtasks = [];
        data.tasks[c.id] = c;
        (data.order[placeCol] = data.order[placeCol] || []).push(c.id);

  }
  // Remove task ids from every in-session undo snapshot so they can't be restored.
  function scrubUndo(ids) {

    for (let i = 0; i < undoStack.length; i++) {
      try {
        const s = JSON.parse(undoStack[i]); let changed = false;
        ids.forEach(tid => {
          if (s.tasks && s.tasks[tid]) {
            delete s.tasks[tid];

  }
  // Permanently delete a task: save, then scrub it from undo history (not recoverable in-session).
  function hardDelete(taskId) { deleteTask(taskId); persist(); scrubUndo([taskId]); }

  // Decide what "completing" a task means. Tasks in a "Work" list are deleted
  // (after confirmation) instead of being marked done. Everything else toggles normally.
  function onComplete(t, proceed) {
    const colId = columnOf(t.id);
    // Only intercept when completing (checking). Un-checking always toggles normally.
    if (!t.done) {
      if (isImportantColumn(colId)) {
        uiConfirm('Complete and delete this Important task?', () => {
          spawnNextOccurrence(t, colId);   // recurring tasks still respawn first
          if (editingId === t.id) { editingId = null; $('#overlay').classList.remove('open'); }
          hardDelete(t.id);
          render();
        });
        return;
      }
      // Any other list: confirm, then complete (mark done + move to a "Done" column).
      uiConfirm('Mark this task complete?', () => {
        toggleDone(t);          // marks done, spawns any recurrence, moves to a Done column
        if (editingId === t.id) { editingId = null; $('#overlay').classList.remove('open'); }
        persist(); render();

    }
    proceed();
  }
  function toggleDone(t) {
    t.done = !t.done;

    const doneCol = findDoneColumn();
    const origin = columnOf(t.id);
    if (t.done) {
      // recurring task: spawn the next occurrence into its originating column
      spawnNextOccurrence(t, origin);
      // moving to Done: remember where it came from so we can restore it later
      if (doneCol && origin && origin !== doneCol.id) { t._fromColumn = origin; moveTask(t.id, doneCol.id); }
    } else {
      // un-completing: send it back to its previous column if that still exists
      if (t._fromColumn && data.order[t._fromColumn]) moveTask(t.id, t._fromColumn);
      t._fromColumn = null;

  }
  function ensureTagColor(name) {
    if (!data.tags[name]) {
      const used = Object.keys(data.tags).length;
      data.tags[name] = TAG_COLORS[used % TAG_COLORS.length];
    }
    return data.tags[name];
  }
  function allTags() { return Array.from(new Set(Object.values(data.tasks).flatMap(t => t.tags))).sort(); }

  /* ---- date helpers ---- */
  function todayStr() {
    const d = new Date(); d.setHours(0,0,0,0);
    return toISODate(d);
  }
  function toISODate(d) {
    const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return z.toISOString().slice(0,10);
  }
  function dueState(due) {
    if (!due) return '';
    const t = todayStr();
    if (due < t) return 'over';
    if (due === t) return 'today';
    return 'future';
  }
  function fmtDue(due) {
    const t = todayStr();
    if (due === t) return 'Today';
    const d = new Date(due+'T00:00:00');
    const now = new Date(t+'T00:00:00');
    const diff = Math.round((d - now)/86400000);
    if (diff === 1) return 'Tomorrow';
    if (diff === -1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric' });
  }
  function addDays(iso, n) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return toISODate(d); }
  function fmtTime(hhmm) {
    if (!hhmm) return '';
    const p = hhmm.split(':'); const d = new Date(); d.setHours(+p[0] || 0, +p[1] || 0, 0, 0);
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  // sort key combining due date + time; timed tasks sort before all-day on the same date, undated last
  function dueKey(t) { return (t.due || '9999-99-99') + 'T' + (t.dueTime || '99:99'); }
  function to24(h, min, ap) {
    h = parseInt(h, 10); min = min ? parseInt(min, 10) : 0;
    if (ap) { ap = ap.toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
    if (h > 23 || min > 59) return null;
    return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
  }
  function computeNextDue(dueStr, freq, every) {
    every = Math.max(1, parseInt(every, 10) || 1);
    const base = new Date((dueStr || todayStr()) + 'T00:00:00');
    const d = new Date(base);
    if (freq === 'daily') d.setDate(d.getDate() + every);
    else if (freq === 'weekly') d.setDate(d.getDate() + 7 * every);
    else if (freq === 'weekdays') { let n = every; while (n > 0) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) n--; } }
    else if (freq === 'monthly') {

  function recurLabel(t) {

  }
  function isDeferred(t) { return !!(t.start && t.start > todayStr()); }
  function isBlocked(t) { return (t.blockedBy || []).some(bid => data.tasks[bid] && !data.tasks[bid].done); }

  /* ---- natural-language quick-add ----
     Understands: today, tomorrow, weekday names, "next <weekday>", "in N days",
     ISO dates (2026-07-01); !high/!med/!low (or !1/!2/!3); #tag (repeatable). */
  function parseQuickAdd(raw) {
    let s = ' ' + (raw || '') + ' ';
    const out = { title:'', due:null, dueTime:null, priority:0, tags:[], recur:'none' };
    s = s.replace(/\s#([^\s#]+)/g, (m, tag) => { out.tags.push(tag); return ' '; });
    s = s.replace(/\s!(?:high|h|3)\b/ig, () => { out.priority = 3; return ' '; });
    s = s.replace(/\s!(?:med|medium|m|2)\b/ig, () => { out.priority = 2; return ' '; });
    s = s.replace(/\s!(?:low|l|1)\b/ig, () => { out.priority = 1; return ' '; });
    const today = todayStr();
    s = s.replace(/\s(\d{4}-\d{2}-\d{2})\b/, (m, d) => { out.due = d; return ' '; });
    if (!out.due) s = s.replace(/\sin (\d{1,3}) days?\b/i, (m, n) => { out.due = addDays(today, parseInt(n, 10)); return ' '; });
    if (!out.due) s = s.replace(/\stoday\b/i, () => { out.due = today; return ' '; });
    if (!out.due) s = s.replace(/\stomorrow\b/i, () => { out.due = addDays(today, 1); return ' '; });
    if (!out.due) {
      const days = { sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,
                     sun:0,mon:1,tue:2,tues:2,wed:3,thu:4,thur:4,thurs:4,fri:5,sat:6 };
      s = s.replace(/\s(next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat)\b/i,
        (m, next, name) => {
          const target = days[name.toLowerCase()];
          const cur = new Date(today + 'T00:00:00').getDay();
          let diff = (target - cur + 7) % 7; if (diff === 0) diff = 7; // always at least 1 day ahead
          out.due = addDays(today, diff);

    s = s.replace(/\b(?:every\s+weekday|weekdays)\b/i, () => { out.recur='weekdays'; return ' '; });
    s = s.replace(/\b(?:every\s+day|daily)\b/i, () => { out.recur='daily'; return ' '; });
    s = s.replace(/\b(?:every\s+month|monthly)\b/i, () => { out.recur='monthly'; return ' '; });
    s = s.replace(/\b(?:every\s+week|weekly)\b/i, () => { if (out.recur==='none') out.recur='weekly'; return ' '; });
    if (!out.due) s = s.replace(/\bnext week\b/i, () => { out.due=addDays(today,7); return ' '; });
    if (!out.due) s = s.replace(/\bnext month\b/i, () => { const d=new Date(today+'T00:00:00'); d.setMonth(d.getMonth()+1); out.due=toISODate(d); return ' '; });
    if (out.recur !== 'none' && !out.due) out.due = today;  // recurrence needs a base date
    // optional time: "at 3pm", "3:30pm", "15:00", "at 15"
    let tm = null;
    s = s.replace(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i, (m, h, mi, ap) => { const v = to24(h, mi, ap); if (v) { tm = v; return ' '; } return m; });
    if (tm === null) s = s.replace(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i, (m, h, mi, ap) => { const v = to24(h, mi, ap); if (v) { tm = v; return ' '; } return m; });
    if (tm === null) s = s.replace(/\b(\d{1,2})\s*(am|pm)\b/i, (m, h, ap) => { const v = to24(h, null, ap); if (v) { tm = v; return ' '; } return m; });
    if (tm) { out.dueTime = tm; if (!out.due) out.due = today; }
    out.title = s.replace(/\s+/g, ' ').trim();
    return out;
  }

  /* ---- minimal, safe Markdown renderer for task notes ---- */
  function renderMarkdown(src) {
    const inline = (s) => escapeHtml(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => {
        const u = safeUrl(url);
        return u ? '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + txt + '</a>' : txt;
      });
    let html = '', listType = null;
    const closeList = () => { if (listType) { html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; } };
    for (const raw of String(src || '').split('\n')) {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) { closeList(); continue; }
      let m;
      if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { closeList(); const lvl = m[1].length; html += '<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>'; continue; }
      if ((m = line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/))) {
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li><span class="md-check">' + (m[1].toLowerCase() === 'x' ? '☑' : '☐') + '</span>' + inline(m[2]) + '</li>'; continue;
      }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li>' + inline(m[1]) + '</li>'; continue;
      }
      if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) {
        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
        html += '<li>' + inline(m[1]) + '</li>'; continue;
      }
      closeList(); html += '<p>' + inline(line) + '</p>';
    }
    closeList();
    return html || '<p class="small">(nothing to preview)</p>';
  }

  /* ---- bulk select helpers ---- */
  function bulkApply(fn) { selectedIds.forEach(i => { const t = data.tasks[i]; if (t) fn(t); }); persist(); render(); }

  /* ---- smart views ---- */
  const SMART = [

  /* ---- filtering / sorting ---- */
  function matchesFilters(t) {
    // Archived tasks are hidden everywhere except the dedicated "Archived" view.
    if (filters.status === 'archived') { if (!t.archived) return false; }
    else {
      if (t.archived) return false;
      if (filters.status === 'active' && t.done) return false;
      if (filters.status === 'completed' && !t.done) return false;
    }
    if (filters.search) {
      const q = filters.search.toLowerCase();
      const hay = (t.title + ' ' + t.notes + ' ' + t.tags.join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (filters.tags.size) { if (!t.tags.some(tag => filters.tags.has(tag))) return false; }
    if (filters.domain) { if (t.domain !== filters.domain) return false; }
    if (filters.rightNow) {
      if (t.done) return false;
      const mins = filters.rightNow.mins;
      if (mins && (!t.estimate || t.estimate > mins)) return false;   // must fit the time you have
      if (filters.rightNow.energy && t.energy && t.energy !== filters.rightNow.energy) return false; // energy match (untagged tasks always allowed)
    }
    if (filters.priorityMin && t.priority < filters.priorityMin) return false;
    if (filters.due !== 'all') {
      const st = dueState(t.due);
      if (filters.due === 'none' && t.due) return false;
      if (filters.due === 'overdue' && st !== 'over') return false;
      if (filters.due === 'today' && st !== 'today') return false;
      if (filters.due === 'week') {
        if (!t.due) return false;
        const diff = (new Date(t.due) - new Date(todayStr()))/86400000;
        if (diff < 0 || diff > 7) return false;
      }
    }
    return true;
  }
  // Extra rules that apply ONLY to the List view (the Board ignores these).
  function listMatch(t) {
    if (!matchesFilters(t)) return false;
    if (filters.status === 'archived') return true; // always show archived here so they can be restored
    if (isDeferred(t)) return false;                // start date not reached yet
    if (t.hideFromList) return false;               // per-task "hide from List"
    if (filters.status === 'all' && data.ui.hideCompletedInList && t.done) return false; // global "hide done"
    return true;
  }
  // Stable: pinned tasks first, everything else in its existing order.
  function arrangePinned(tasks) {
    const pinned = [], rest = [];
    tasks.forEach(t => (t.pinned ? pinned : rest).push(t));
    return pinned.concat(rest);
  }
  function sortTasks(tasks) {
    const s = filters.sort;
    const arr = tasks.slice();
    if (s === 'due') arr.sort((a,b)=> dueKey(a).localeCompare(dueKey(b)));
    else if (s === 'priority') arr.sort((a,b)=> b.priority - a.priority);
    else if (s === 'created') arr.sort((a,b)=> (a.createdAt||'').localeCompare(b.createdAt||''));
    else if (s === 'alpha') arr.sort((a,b)=> a.title.localeCompare(b.title));
    return arr;
  }

    qi.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addNow(); } };
    const addBtn = el('button', 'primary', 'Add'); addBtn.style.flex = '0 0 auto';
    addBtn.onclick = (e) => { e.stopPropagation(); addNow(); };
    qa.appendChild(qi); qa.appendChild(addBtn); body.appendChild(qa);

    ids.forEach((tid, index) => body.appendChild(renderCard(data.tasks[tid], col.id, index)));

    // drag & drop onto column
    body.addEventListener('dragover', (e) => { e.preventDefault(); wrap.classList.add('dragover'); });
    body.addEventListener('dragleave', () => wrap.classList.remove('dragover'));
    body.addEventListener('drop', (e) => {

  /* ---- List ---- */
  function clearFilters() { filters.status = 'all'; filters.due = 'all'; filters.tags.clear(); filters.priorityMin = 0; filters.rightNow = null; data.ui.hideCompletedInList = false; activeSmart = null; syncFilterControls(); saveOut(); render(); }
  function renderList() {
    const wrap = el('div', 'list');
    const all = Object.values(data.tasks).filter(listMatch);
    if (!all.length) {
      if (filters.status === 'archived') wrap.appendChild(emptyState('🗂️', 'No archived tasks', 'Tasks you archive will appear here.'));
      else if (Object.keys(data.tasks).length === 0) wrap.appendChild(emptyState('🌱', 'No tasks yet', 'Capture your first one — type in the box above, or tap the + button.', '+ Add a task', focusQuickAdd));
      else wrap.appendChild(emptyState('🔍', 'Nothing matches', 'No tasks fit the current filters.', 'Clear filters', clearFilters));
      return wrap;
    }

    // Nested rendering: a task is a "root" here if its parent isn't part of the
    // visible set (top-level, or a child whose parent was filtered out). Children
    // are drawn indented directly beneath their parent, regardless of column.
    const visible = new Set(all.map(t => t.id));
    const seen = new Set();
    const isRoot = t => !t.parentId || !visible.has(t.parentId);
    const renderNode = (t, level) => {
      if (seen.has(t.id)) return; seen.add(t.id);
      wrap.appendChild(renderCard(t, columnOf(t.id), 0, level));
      if (t.collapsed) return;
      childrenOf(t.id).forEach(ch => { if (visible.has(ch.id)) renderNode(ch, level + 1); });
    };
    if (filters.sort === 'manual') {
      // group by column in board order; count only the roots that live in each column
      data.columns.forEach(col => {
        const ids = (data.order[col.id]||[]).filter(tid => data.tasks[tid] && visible.has(tid) && isRoot(data.tasks[tid]));
        if (!ids.length) return;
        const dot = col.color ? '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + col.color + ';margin-right:6px;vertical-align:middle;"></span>' : '';
        wrap.appendChild(el('div','list-group-title', dot + escapeHtml(col.name) + ' · ' + ids.length));
        arrangePinned(ids.map(tid => data.tasks[tid])).forEach(t => renderNode(t, 0));
      });
    } else {
      arrangePinned(sortTasks(all.filter(isRoot))).forEach(t => renderNode(t, 0));
    }
    return wrap;
  }
  function emptyMsg() {
    if (filters.status === 'archived') return 'No archived tasks.';
    if (Object.keys(data.tasks).length === 0) return 'No tasks yet. Use “+ Task” or the quick-add box to begin.';
    return 'No tasks match the current filters.';
  }

  /* ---- Agenda (group by due window) ---- */
  function renderAgenda() {
    const wrap = el('div', 'list');
    const tasks = Object.values(data.tasks).filter(t => matchesFilters(t) && !isDeferred(t));
    const today = todayStr(), t1 = addDays(today, 1), t7 = addDays(today, 7);
    const groups = [
      { label:'Overdue',   test: t => t.due && t.due < today && !t.done },
      { label:'Today',     test: t => t.due === today },
      { label:'Tomorrow',  test: t => t.due === t1 },
      { label:'This week', test: t => t.due && t.due > t1 && t.due <= t7 },
      { label:'Later',     test: t => t.due && t.due > t7 },
      { label:'No date',   test: t => !t.due },
    ];
    const assigned = new Set();
    let any = false;
    groups.forEach(g => {
      const items = tasks.filter(t => !assigned.has(t.id) && g.test(t));
      items.forEach(t => assigned.add(t.id));
      if (!items.length) return;
      any = true;
      items.sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
      wrap.appendChild(el('div', 'list-group-title', g.label + ' · ' + items.length));
      arrangePinned(items).forEach(t => wrap.appendChild(renderCard(t, columnOf(t.id), 0)));
    });
    if (!any) wrap.appendChild(emptyState('📅', 'Agenda is clear', 'No dated tasks to show. Add one with a due date and it’ll appear here.', '+ Add a task', focusQuickAdd));
    return wrap;
  }

  /* ---- Eisenhower matrix (urgent × important) ---- */
  function renderMatrix() {
    const today = todayStr(), soon = addDays(today, 2);
    const tasks = Object.values(data.tasks).filter(t => matchesFilters(t) && !isDeferred(t) && !t.done);
    const urgent = t => t.due && t.due <= soon;
    const important = t => t.priority >= 2;
    const quads = [
      { label:'Do now · urgent + important',          test: t => urgent(t) && important(t) },
      { label:'Schedule · important, not urgent',      test: t => !urgent(t) && important(t) },
      { label:'Delegate / quick · urgent, low priority', test: t => urgent(t) && !important(t) },
      { label:'Later · neither',                       test: t => !urgent(t) && !important(t) },
    ];
    const grid = el('div', 'matrix');
    quads.forEach(q => {
      const cell = el('div', 'matrix-cell');
      const items = tasks.filter(q.test).sort((a, b) => dueKey(a).localeCompare(dueKey(b)) || b.priority - a.priority);
      cell.appendChild(el('div', 'list-group-title', q.label + ' · ' + items.length));
      if (!items.length) cell.appendChild(el('div', 'small', '—'));
      arrangePinned(items).forEach(t => cell.appendChild(renderCard(t, columnOf(t.id), 0)));
      grid.appendChild(cell);
    });
    return grid;
  }

  /* ---- duration / clock helpers ---- */
  function fmtDur(min) { min = Math.round(min || 0); const h = Math.floor(min / 60), m = min % 60; return h ? (h + 'h' + (m ? (' ' + m + 'm') : '')) : (m + 'm'); }
  function fmtClock(mins) { mins = ((Math.round(mins) % 1440) + 1440) % 1440; let h = Math.floor(mins / 60), m = mins % 60; const ap = h < 12 ? 'AM' : 'PM'; let hh = h % 12; if (hh === 0) hh = 12; return hh + ':' + String(m).padStart(2, '0') + ' ' + ap; }

  /* ---- Plan my day (time-blocking timeline) ---- */
  function renderPlan() {
    const wrap = el('div', 'today'); const today = todayStr();
    const startMin = (data.ui.planStart != null) ? data.ui.planStart : 540;   // 9:00
    const endMin = (data.ui.planEnd != null) ? data.ui.planEnd : 1020;        // 17:00
    // pomodoro bar
    const pomo = el('div', 'pomo');
    pomo.innerHTML = '<span class="pomo-time" id="pomoTime">' + (pomoTimer ? fmtPomo() : '25:00') + '</span>';
    const pb = el('button', 'ghost', pomoTimer ? 'Stop' : '🍅 Start 25-min focus');
    pb.onclick = () => { if (pomoTimer) pomoStop(); else pomoStart(25); render(); };
    pomo.appendChild(pb); wrap.appendChild(pomo);
    // controls
    const ctl = el('div'); ctl.style.cssText = 'display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0;';
    const mkTime = (val, on) => { const i = el('input'); i.type = 'time'; i.value = toClock24(val); i.style.width = '120px'; i.onchange = () => { on(fromClock24(i.value)); saveOut(); render(); }; return i; };
    ctl.appendChild(el('span', 'small', 'Day from')); ctl.appendChild(mkTime(startMin, v => data.ui.planStart = v));
    ctl.appendChild(el('span', 'small', 'to')); ctl.appendChild(mkTime(endMin, v => data.ui.planEnd = v));
    wrap.appendChild(ctl);
    // today's work: active, not done, not deferred, due today or overdue or pinned
    let items = Object.values(data.tasks).filter(t => !t.archived && !t.done && !isDeferred(t) && (t.due === today || (t.due && t.due < today) || t.pinned));
    items.sort((a, b) => (b.priority - a.priority) || dueKey(a).localeCompare(dueKey(b)));
    items = arrangePinned(items);
    if (!items.length) { wrap.appendChild(el('div', 'empty', 'Nothing scheduled for today. Set tasks due today (or pin them) and give them an estimate to plan your day.')); return wrap; }
    let cursor = startMin; let total = 0;
    items.forEach(t => {
      const est = t.estimate || 30; total += est;
      const blockStart = cursor, blockEnd = cursor + est; cursor = blockEnd;
      const row = el('div', 'plan-row');
      const time = el('div', 'plan-time', fmtClock(blockStart) + '<br><span class="small">' + fmtDur(est) + '</span>');
      const block = el('div', 'plan-block'); block.style.borderLeftColor = (t.priority > 0 ? PRIO[t.priority].color : 'var(--accent)');
      if (blockStart >= endMin) block.classList.add('over');
      block.innerHTML = '<div>' + escapeHtml(t.title || '(untitled)') + '</div><div class="small">' + fmtClock(blockStart) + ' – ' + fmtClock(blockEnd) + (blockStart >= endMin ? ' · past end of day' : '') + '</div>';
      block.onclick = () => openModal(t.id);
      row.appendChild(time); row.appendChild(block); wrap.appendChild(row);
    });
    const finish = startMin + total;
    const summ = el('div', 'small'); summ.style.marginTop = '8px';
    summ.textContent = items.length + ' task' + (items.length === 1 ? '' : 's') + ' · ' + fmtDur(total) + ' planned · finishes ' + fmtClock(finish) + (finish > endMin ? ('  ⚠ ' + fmtDur(finish - endMin) + ' past your day') : '');
    wrap.appendChild(summ);
    return wrap;
  }
  function toClock24(mins) { const h = Math.floor(mins / 60), m = mins % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'); }
  function fromClock24(s) { const p = (s || '09:00').split(':'); return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0); }

  /* ---- Pomodoro ---- */
  function fmtPomo() { const r = Math.max(0, pomoRemaining); return Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); }
  function pomoStart(mins) { pomoStop(); pomoRemaining = mins * 60; pomoTimer = setInterval(() => { pomoRemaining--; const e = document.getElementById('pomoTime'); if (e) e.textContent = fmtPomo(); if (pomoRemaining <= 0) { pomoStop(); pomoDone(); render(); } }, 1000); }
  function pomoStop() { if (pomoTimer) { clearInterval(pomoTimer); pomoTimer = null; } }
  function pomoDone() { try { if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance('Pomodoro complete. Take a break.')); } catch (e) {} uiConfirm('🍅 Pomodoro complete — take a short break.', () => {}); }

  /* ---- Guided Weekly Review ---- */
  function startReview() {
    const today = todayStr();
    const overdue = Object.values(data.tasks).filter(t => !t.archived && !t.done && t.due && t.due < today);
    const nodate = Object.values(data.tasks).filter(t => !t.archived && !t.done && !t.due);
    reviewQueue = []; overdue.forEach(t => reviewQueue.push({ id: t.id, kind: 'overdue' })); nodate.forEach(t => reviewQueue.push({ id: t.id, kind: 'nodate' }));
    reviewIdx = 0; reviewStats = { resched: 0, dropped: 0, archived: 0, done: 0 };
    let ov = document.getElementById('reviewOverlay'); if (ov) ov.remove();
    ov = el('div', 'overlay'); ov.id = 'reviewOverlay'; ov.style.display = 'flex'; ov.style.zIndex = '115';
    const box = el('div', 'modal'); box.id = 'reviewBox'; box.style.maxWidth = '460px'; ov.appendChild(box); document.body.appendChild(ov);

  }
  function endReview() { const ov = document.getElementById('reviewOverlay'); if (ov) ov.remove(); render(); }
  function reviewStep() {
    const box = document.getElementById('reviewBox'); if (!box) return; box.innerHTML = '';
    const today = todayStr();
    if (reviewIdx < reviewQueue.length) {
      const item = reviewQueue[reviewIdx]; const t = data.tasks[item.id];
      if (!t) { reviewIdx++; return reviewStep(); }
      const head = el('div', 'modal-head', '<strong style="flex:1">Weekly review · ' + (reviewIdx + 1) + ' of ' + reviewQueue.length + '</strong>');
      const x = el('button', 'iconbtn', '✕'); x.onclick = endReview; head.appendChild(x); box.appendChild(head);
      const body = el('div', 'modal-body');

      const acts = el('div'); acts.style.cssText = 'display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;';
      const adv = () => { persist(); reviewIdx++; reviewStep(); };
      const mk = (label, cls, fn) => { const b = el('button', cls || 'ghost', label); b.onclick = () => { fn(); adv(); }; return b; };
      acts.appendChild(mk('Today', null, () => { t.due = today; reviewStats.resched++; }));
      acts.appendChild(mk('Tomorrow', null, () => { t.due = addDays(today, 1); reviewStats.resched++; }));
      acts.appendChild(mk('+1 week', null, () => { t.due = addDays(today, 7); reviewStats.resched++; }));
      if (item.kind === 'overdue') acts.appendChild(mk('Clear due date', null, () => { t.due = null; }));
      acts.appendChild(mk('Mark done', null, () => { t.done = true; t.completedAt = new Date().toISOString(); reviewStats.done++; }));
      acts.appendChild(mk('Delete', 'danger', () => { deleteTask(t.id); reviewStats.dropped++; }));

      const head = el('div', 'modal-head', '<strong style="flex:1">Review complete</strong>'); box.appendChild(head);
      const body = el('div', 'modal-body');
      body.appendChild(el('div', null, 'Rescheduled ' + reviewStats.resched + ', completed ' + reviewStats.done + ', deleted ' + reviewStats.dropped + (reviewStats.archived ? (', archived ' + reviewStats.archived) : '') + '.'));
      const doneIds = Object.values(data.tasks).filter(t => t.done && !t.archived).map(t => t.id);
      if (doneIds.length) {
        const b = el('button', 'ghost', 'Archive ' + doneIds.length + ' completed task' + (doneIds.length === 1 ? '' : 's')); b.style.marginTop = '8px';
        b.onclick = () => { doneIds.forEach(i => data.tasks[i].archived = true); reviewStats.archived += doneIds.length; persist(); reviewStep(); };

      box.appendChild(body);
      const foot = el('div', 'modal-foot'); foot.style.justifyContent = 'flex-end'; const ok = el('button', 'primary', 'Done'); ok.onclick = endReview; foot.appendChild(ok); box.appendChild(foot);
    }
  }

  /* ---- Focus view: deterministic "what to do next" ranking ---- */
  function focusScore(t) {
    const today = todayStr(); let s = (t.priority || 0) * 10;
    if (t.due) {
      if (t.due < today) s += 40;
      else if (t.due === today) s += 25;
      else { const diff = (new Date(t.due) - new Date(today)) / 86400000; if (diff <= 2) s += 12; else if (diff <= 7) s += 5; }
    }
    if (t.createdAt) { const age = (Date.now() - new Date(t.createdAt)) / 86400000; s += Math.min(10, Math.floor(age / 3)); }
    return s;
  }
  function renderFocus() {
    const wrap = el('div', 'list'); const today = todayStr();
    const cand = Object.values(data.tasks).filter(t => !t.archived && !t.done && !isDeferred(t) && !isBlocked(t) && matchesFilters(t));
    cand.sort((a, b) => focusScore(b) - focusScore(a) || dueKey(a).localeCompare(dueKey(b)));
    if (!cand.length) { wrap.appendChild(el('div', 'empty', 'Nothing to focus on right now — you’re clear, or the rest is blocked or deferred.')); return wrap; }
    wrap.appendChild(el('div', 'list-group-title', 'Top focus · what to do next'));
    cand.slice(0, 8).forEach(t => {
      wrap.appendChild(renderCard(t, columnOf(t.id), 0));
      const reason = [];
      if (t.due && t.due < today) reason.push('overdue'); else if (t.due === today) reason.push('due today');
      if (t.priority >= 2) reason.push((t.priority === 3 ? 'high' : 'medium') + ' priority');
      if (reason.length) { const r = el('div', 'small'); r.style.cssText = 'margin:-4px 0 8px 26px;'; r.textContent = '↳ ' + reason.join(' · '); wrap.appendChild(r); }
    });
    return wrap;
  }

  function useTemplate(tpl) {

  /* ---- Stats ---- */
  function openStats() {
    const all = Object.values(data.tasks).filter(t => !t.archived);
    const total = all.length, done = all.filter(t => t.done).length, active = total - done;
    const today = todayStr();
    const overdue = all.filter(t => !t.done && t.due && t.due < today).length;
    const dueToday = all.filter(t => !t.done && t.due === today).length;
    const rate = total ? Math.round(done / total * 100) : 0;
    const weekAgo = addDays(today, -7);
    const doneWeek = all.filter(t => t.done && t.completedAt && t.completedAt.slice(0, 10) >= weekAgo).length;
    const archived = Object.values(data.tasks).filter(t => t.archived).length;
    const prioLabels = ['None', 'Low', 'Medium', 'High'];
    const byP = [0, 0, 0, 0]; all.forEach(t => { if (!t.done) byP[t.priority]++; });
    const tagCount = {}; all.forEach(t => { if (!t.done) t.tags.forEach(tg => tagCount[tg] = (tagCount[tg] || 0) + 1); });
    const card = (n, l) => '<div class="stat-card"><div class="stat-num">' + n + '</div><div class="stat-label">' + l + '</div></div>';
    let html = '<div class="stat-grid">' +
      card(active, 'Active') + card(done, 'Completed') +
      card(overdue, 'Overdue') + card(dueToday, 'Due today') +
      card(rate + '%', 'Completion rate') + card(doneWeek, 'Done in last 7 days') + '</div>';
    const maxP = Math.max(1, byP[1], byP[2], byP[3]);
    html += '<div style="margin-top:14px;"><div class="stat-label" style="margin-bottom:4px;">Active by priority</div>';
    [3, 2, 1].forEach(p => {
      html += '<div class="bar-row"><span style="width:62px;">' + prioLabels[p] + '</span><span class="bar-track"><span class="bar-fill" style="width:' + (byP[p] / maxP * 100) + '%"></span></span><span>' + byP[p] + '</span></div>';
    });
    html += '</div>';
    const tags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
    if (tags.length) {

      });

    html += '<div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">' +

      '<button class="ghost" id="stats_tagColors">Tag colors…</button>' +
      '<button class="ghost" id="stats_templates">Templates…</button>' +

  /* ---- Fast inline edits (rename / reschedule without opening the editor) ---- */
  function startInlineRename(t, titleEl) {

    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { render(); } };
    inp.onblur = commit;

  }
  function rescheduleInline(t, card) {
    const inp = el('input'); inp.type = 'date'; inp.className = 'inline-due'; inp.value = t.due || '';

  // Swipe (List/Agenda, touch): right = complete, left = reschedule. Not on the Board,
  // where horizontal swipes are reserved for moving between columns.
  function attachSwipe(card, t, guard) {
    let sx = 0, sy = 0, dx = 0, active = false, decided = false, horiz = false;
    card.addEventListener('touchstart', e => { if (e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; active = true; decided = false; horiz = false; card.style.transition = 'none'; }, { passive: true });
    card.addEventListener('touchmove', e => {
      if (!active) return; dx = e.touches[0].clientX - sx; const dy = e.touches[0].clientY - sy;
      if (!decided && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { decided = true; horiz = Math.abs(dx) > Math.abs(dy); }
      if (horiz) { e.preventDefault(); card.style.transform = 'translateX(' + dx + 'px)'; card.classList.toggle('swipe-right', dx > 0); card.classList.toggle('swipe-left', dx < 0); }
    }, { passive: false });
    const end = () => {
      if (!active) return; active = false; card.style.transition = 'transform .18s ease';
      const TH = 90;
      if (horiz && dx > TH) { guard.suppress = true; card.style.transform = 'translateX(110%)'; card.style.opacity = '0'; setTimeout(() => onComplete(t, () => { toggleDone(t); persist(); render(); }), 130); }
      else { card.style.transform = ''; card.classList.remove('swipe-left', 'swipe-right'); if (horiz && dx < -TH) { guard.suppress = true; rescheduleInline(t, card); } }
    };
    card.addEventListener('touchend', end); card.addEventListener('touchcancel', end);
  }

    return card;

  /* =======================  MIT / WINS  ======================= */
  // --- MIT (Most Important Task) ---
  function todayMITs() { const t = todayStr(); return Object.values(data.tasks).filter(x => !x.archived && x.mit === t); }
  function mitDayWon() { const m = todayMITs(); return m.length > 0 && m.every(x => x.done); }
  function setMIT(t, on) {
    const today = todayStr();
    if (on) {
      if (t.mit !== today && todayMITs().length >= MIT_MAX) { uiConfirm('You already have ' + MIT_MAX + ' Most Important Tasks for today. The whole point is to pick only a few — finish or unstar one first.', () => {}); return false; }
      t.mit = today;
    } else t.mit = null;
    return true;
  }
  // --- wins & momentum ---
  function winsFor(dstr) { return (data.wins && data.wins[dstr]) || []; }
  function addWin(text) { text = (text || '').trim(); if (!text) return; const d = todayStr(); data.wins = data.wins || {}; (data.wins[d] = data.wins[d] || []).push(text); }
  function doneOn(dstr) { return Object.values(data.tasks).filter(t => t.done && t.completedAt && t.completedAt.slice(0, 10) === dstr).length; }
  function completedTitlesSince(dstr) { return Object.values(data.tasks).filter(t => t.done && t.completedAt && t.completedAt.slice(0, 10) >= dstr).sort((a, b) => b.completedAt.localeCompare(a.completedAt)); }
  function shipStreak() { const today = todayStr(); let s = 0, d = today; while (true) { const has = doneOn(d) > 0 || winsFor(d).length > 0; if (has) s++; else if (d !== today) break; d = addDays(d, -1); if (d < '2000-01-01') break; } return s; }
  // --- life balance ---
  function domainStats(days) { const today = todayStr(); const cut = addDays(today, -(days - 1)); const res = {}; DOMAINS.forEach(dm => res[dm.k] = { open:0, openMin:0, doneWk:0, lastActive:null, used:false });
    Object.values(data.tasks).forEach(t => { if (t.archived || !t.domain || !res[t.domain]) return; const r = res[t.domain]; r.used = true;
      if (!t.done) { r.open++; r.openMin += (t.estimate || 0); }
      if (t.done && t.completedAt && t.completedAt.slice(0, 10) >= cut) r.doneWk++;
      [t.completedAt && t.completedAt.slice(0, 10), t.createdAt && t.createdAt.slice(0, 10)].filter(Boolean).forEach(x => { if (!r.lastActive || x > r.lastActive) r.lastActive = x; });
    }); return res; }
  function daysSince(dstr) { if (!dstr) return null; return Math.round((new Date(todayStr() + 'T00:00:00') - new Date(dstr + 'T00:00:00')) / 86400000); }
  // --- estimate accuracy & throughput ---
  function calibration() { const arr = Object.values(data.tasks).filter(t => t.estimate && t.actualMin); if (arr.length < 3) return { n: arr.length, ratio: null }; let est = 0, act = 0; arr.forEach(t => { est += t.estimate; act += t.actualMin; }); return { n: arr.length, ratio: act / est, est, act }; }
  function throughputWeeks(nWeeks) { const today = todayStr(); const arr = []; for (let w = 0; w < nWeeks; w++) { const end = addDays(today, -7 * w); const start = addDays(end, -6); let n = 0, min = 0; Object.values(data.tasks).forEach(t => { if (t.done && t.completedAt) { const cd = t.completedAt.slice(0, 10); if (cd >= start && cd <= end) { n++; min += (t.estimate || 0); } } }); arr.push({ n, min }); } return arr.reverse(); }
  function quickWins() { return Object.values(data.tasks).filter(t => !t.done && !t.archived && t.impact >= 2 && t.estimate && t.estimate <= 20).sort((a, b) => b.impact - a.impact || a.estimate - b.estimate); }
  // --- procrastination radar ---
  function stickyTasks(min) { return Object.values(data.tasks).filter(t => !t.done && !t.archived && (t.bumpCount || 0) >= min).sort((a, b) => (b.bumpCount || 0) - (a.bumpCount || 0)); }

  // --- right-now surfacing ---
  function openRightNow() {
    const ov = el('div', 'overlay'); ov.style.display = 'flex'; ov.style.zIndex = '100';
    const box = el('div', 'modal'); box.style.maxWidth = '360px';
    const head = el('div', 'modal-head', '<strong class="grow">⚡ What can I do right now?</strong>');
    const close = el('button', 'iconbtn', '✕'); close.onclick = () => ov.remove(); head.appendChild(close);
    const body = el('div', 'modal-body');
    body.appendChild(el('div', 'small', 'Surface active tasks that fit the time and energy you actually have. (Tasks need an Estimate to match on time; untagged energy always shows.)'));
    const f1 = el('div', 'field'); f1.appendChild(el('label', null, 'I have about…'));
